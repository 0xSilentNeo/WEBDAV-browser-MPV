# webdav-browser.conf  (script v13.1; the poster options only apply to webdav-browser-posters.lua)
# Location: <mpv config>/script-opts/webdav-browser.conf   (Windows: %APPDATA%\mpv\script-opts\)
# The file is re-read live while the browser is open, so most changes apply without restarting mpv.
# Comments go on their own line. Booleans: yes/no (true/false also work).
#
# CREDENTIALS ARE NOT INCLUDED IN THIS FILE. Add your own two lines (no spaces around the value):
#   user=YOUR_REAL_DEBRID_USERNAME
#   pass=YOUR_WEBDAV_PASSWORD

url=https://dav.real-debrid.com

user=YOUR_REAL_DEBRID_USERNAME
pass=YOUR_WEBDAV_PASSWORD

# free key from themoviedb.org > Settings > API: the 32-character API key, or the long read-access token (starts with eyJ)
tmdb_key=

# OPTIONAL. Your Real-Debrid API token (real-debrid.com/apitoken). Leave it empty if you prefer not to use it -
# everything else works without it. With it, the missing-episode cards say WHY a file is missing
# ("Hoster unavailable", "File unavailable", "Torrent dead"...), straight from Real-Debrid.
# The token is only ever sent to Real-Debrid's API, never to TMDB, and is kept out of the mpv log.
rd_api_token=


start_path=/torrents
# name | recent
default_sort=recent
font_size=28

# ===================== playback =====================
autoplay_next=yes
# let mpv prepare the next queued file while the current one plays
prefetch=yes
# close the browser automatically once a file starts playing
auto_close_on_play=yes
# how a file is retried when it fails to open
max_retries=2
retry_delay=1.5

# ===================== network =====================
curl_path=curl
request_timeout=15

# listings older than this are shown instantly, then refreshed quietly (seconds)
cache_ttl=600

# send credentials only for files on your server
scoped_auth=yes

# ===================== library search ('f') =====================
index_enabled=yes
index_auto_update=yes
index_refresh_hours=24
index_delay_secs=0.6

# ===================== interface =====================
# "S01E03" + [4K] [HDR] [DV] [ATMOS] chips; set to no to see raw names (EXPERIMENTAL)
experimental_clean_titles=yes
clean_titles_chips=yes
clean_titles_tooltip=yes
double_click_ms=400
scroll_lines=3
resume_notice=yes
start_over_key=b
continue_row=yes

# auto | lite | full | off
background_blur_mode=auto

# press 'd' in the browser to toggle at any time
debug_overlay=no

# ===================== New in 10.1 =====================
# how credentials reach curl: auto (Windows = command line, others = stdin) | arg | stdin
curl_auth_mode=auto

# ===================== New in 10.2 =====================
# visited = search only the folders you open | full = also crawl the whole library in the background
index_mode=visited

# buffering (RAM). Whichever limit is reached first stops buffering.
# seconds of video to buffer ahead (was 60)
demuxer_readahead_secs=300

# forward buffer in MiB, 1024 = 1 GiB of RAM (was 300)
demuxer_max_bytes_mb=1024

# backward buffer in MiB, used when seeking back (was 50)
demuxer_max_back_bytes_mb=256

# queue + prefetch the next episode at this percent of the current one (was 70)
prefetch_threshold_pct=75

# ...or earlier, as soon as the current file is completely buffered
prefetch_on_buffered=yes

# ===================== New in 10.3 =====================
# right edge of file rows: "Watched" / "20% - 40:00 left" (no = only the small tick after the name)
show_status_text=yes
watched_label=Watched

# keep mpv open when a file fails to load, instead of quitting
stay_open=yes

# let ffmpeg reconnect dropped HTTP streams
http_reconnect=yes

# ===================== New in 10.4 =====================
# DOWNLOAD-WHILE-PLAYING fallback. When streaming a file fails (for example Real-Debrid answering
# HTTP 503 to mpv's range requests), the file is downloaded with curl and played while it downloads.
# You can also start it yourself with the P key on a highlighted file.
fallback_download=yes

# start the fallback after this many failed stream attempts (1 = immediately)
fallback_after_failures=1

# start playing once this many MB are downloaded
fallback_start_mb=200

# folder for the partial download; empty = <temp folder>/webdav-browser-cache
fallback_dir=

# how long playback waits for the download to catch up before giving up (seconds)
fallback_stall_secs=45

# keep the downloaded file afterwards (no = delete it)
fallback_keep=no

# leftover files older than this are removed at startup (hours)
fallback_cleanup_hours=24

# ===================== New in 10.5 =====================
# left-panel folder names: "Title  S01  GROUP  [4K] [HDR]" instead of the full release name
# (the release group, e.g. Framestore / VARYG, is kept; the full name shows in the tooltip)
clean_folder_titles=yes

# ===================== New in 10.6 =====================
# Key(s) that open/close the browser. Needs an mpv restart. Names like ctrl+p, ctrl+shift+p, alt+b, F2.
# Several keys on one script: separate with spaces, e.g.  open_key=ctrl+w alt+w
# webdav-browser.lua (plain) uses open_key; webdav-browser-posters.lua uses open_key_posters.
# You can keep BOTH scripts installed with different keys: opening one closes the other, and they share
# watch history. Keep the two keys different.
open_key=ctrl+w
open_key_posters=ctrl+p

# ===================== Poster edition (webdav-browser-posters.lua only) =====================
# Shows the TMDB poster of the open folder in a column on the right of the classic list view.
# The plain webdav-browser.lua ignores these lines.
experimental_posters=yes

# width of the poster column as a percent of the window (the file list gets narrower; window must be 900px+ wide)
poster_column_pct=17

# auto | powershell | ffmpeg | magick   (New in 13: auto = ffmpeg when it is installed - much faster - else PowerShell on Windows)
poster_converter=auto

# empty = <mpv config>/script-opts/webdav_posters
poster_cache_dir=

# ===================== New in 10.7 (webdav-browser-posters.lua only) =====================
# Netflix-style home screen: rows of poster cards with the clean title underneath
# (Continue Watching, All Titles). Enter opens a title or resumes a Continue Watching card.
# Keys on the home screen: arrows/hjkl move, Enter open/play, O open folder, F search, V classic list view, Esc close.
# Inside a title, Esc goes back to the home screen, V jumps to it.
# no = open straight into the classic list view
home_view=yes

# poster card width as a percent of the window height (bigger number = bigger posters, fewer per row)
home_card_pct=19

# ===================== New in 10.8 (webdav-browser-posters.lua only) =====================
# Enter on a title opens a title page: poster, description and one still image per episode (from TMDB), grouped by season.
# Keys there: Enter play, A queue, M watched/unwatched, S sort, V classic list, T look the artwork up again, Esc back.
# yes = all seasons of a show become ONE card on the home screen (the title page lists every season)
merge_seasons=yes

# yes = playing a file also queues the files after it (a real mpv playlist; works across seasons on the title page)
queue_folder=yes

# never queue more than this many files at once
queue_max=200

# home screen / title page: press twice to delete the poster, still and listing cache (watch history is never touched)
# (New in 11: the plain webdav-browser.lua uses this key too - there it clears the folder-listing cache)
cache_clear_key=ctrl+x

# ===================== New in 11 =====================
# Both scripts: file rows line up in columns (E01 | quality | size | episode name), episode names are taken from the
# file name, and the playlist shows file names instead of links. Nothing to set for these.
#
# --- webdav-browser-posters.lua only ---
# A title with several seasons opens on its seasons first (one card per season, with the season's own TMDB poster);
# Enter opens a season, Esc goes back to the seasons.
#

# Title page: warn about episodes WebDAV does not list (gaps in the numbering) and show a greyed card for each one.
show_missing_episodes=yes

# EXPERIMENTAL. yes = folders that match the same TMDB title become ONE card on the home screen, for example
# "Bleach USBD Remux TL", "Bleach - Box 01", "Bleach.S17..." and "[WF] BLEACH: Sennen Kessen-hen" -> one "Bleach"
# card whose title page lists Season 1, 2 ... 17. Folders that cannot be matched stay separate cards.
experimental_merge_by_tmdb=no

# Pin a folder to a TMDB title when the lookup keeps picking the wrong one. Entries separated by ";".
#   <words from the folder name>=tv:<TMDB id>   or   =movie:<TMDB id>   (optional :<season> = the folder holds that season)
# The id is the number in the TMDB address, e.g. themoviedb.org/tv/65930 -> tv:65930.
# Example: poster_overrides=boku no hero=tv:65930; sennen kessen=tv:30984:17
# After changing it, press T on the title (look the art up again).
poster_overrides=

# ===================== New in 12 =====================
# Both scripts: folders that Real-Debrid is still filling (it adds the links of a big torrent gradually) are re-checked
# every few seconds while you look at them, and are not trusted in the cache until they stop growing. Folder listings
# are now saved in their own file (dirs.json, in the poster cache folder) instead of inside the watch-history file.
# Nothing to set for these.
#
# --- webdav-browser-posters.lua only ---

# Size of every poster screen. 1.0 = sized to the window (a 4K window gets the same layout as a 1080p one, just sharper);
# 1.2 = 20% bigger, 0.85 = smaller.
ui_scale=1.0

# Continue Watching shows the still of the episode you are in (16:9) instead of the show's poster.
continue_landscape=yes

# EXPERIMENTAL. Gliding selection outline, a quick fade-in when a screen opens and shimmering placeholders while artwork
# loads. Posters themselves cannot fade or glide (mpv moves them one at a time, so a smooth scroll tears - v13.1 removed
# it). Switched off while a video plays.
experimental_animations=no

# Search box filters (typed, or click the chips under the box):
#   genre:anime  genre:drama  year:2004  year:2000-2010  year:2010s  year:>2015  type:tv  type:movie  rating:8  unwatched  watched
# Typos in titles are tolerated ("bleahc" finds Bleach).

# ===================== New in 13 =====================
# Both scripts: the audio and subtitle language are remembered PER SHOW. Pick Japanese audio + English subtitles once
# in any Bleach episode and every Bleach episode starts that way; another show keeps its own choice.
remember_tracks=yes
#
# --- webdav-browser-posters.lua only ---
# Anime titles: romaji folder names ("Vanitas no Carte") are looked up on AniList (no key needed), and the AniList id is
# mapped to the exact TMDB entry - including which TMDB season and episode a "Part 2" or "S17" folder is - with the
# anime-lists id map (downloaded once, ~6 MB, refreshed weekly). Only anime-looking folders and weak TMDB matches use
# it; every answer is cached. poster_overrides still wins.
anime_lookup=yes

# Rounded corners on posters and stills (pixels at 1080p; 0 = square) and a soft shadow under every card.
card_radius=6
card_shadows=yes

# The selected card grows by this factor (1 = off).
selected_grow=1.06

# While nothing else is loading, prepare the artwork this many rows ahead (and the next page of each row),
# so scrolling does not show placeholders.
idle_prefetch_rows=3

# Gamepad / TV remote. mpv needs input-gamepad=yes for gamepads (the script switches it on unless couch_mode=no).
#   D-pad / left stick move, A open / play, B back, X watched, Y queue, LB / RB page, Start sort, View open / close.
# auto = bigger focus ring, bigger text and a button legend as soon as a gamepad or remote key is used (the mouse
# switches back); yes = always; no = off (and no gamepad keys are bound to open the browser).
couch_mode=auto

# gamepad / remote key(s) that open and close the poster browser
couch_open_keys=GAMEPAD_BACK

# "Next episode in 10..." card with the next episode's still and name: appears at the ED / Ending / Credits chapter
# (or the last seconds of the file when there is none). At 0 the next episode starts (the rest of the credits is
# skipped and the episode counts as watched); Esc keeps watching, Enter plays it right away.
next_episode_card=yes
next_episode_secs=10

# EXPERIMENTAL. Title page: a large TMDB backdrop on the right of the text, faded into the background (the fade is
# baked into the image). Needs ffmpeg or PowerShell (not magick).
experimental_backdrop=no

# ===================== New in 13.1 =====================
# Both scripts now have the "Next episode in 10..." card (the list edition shows it without the still) and gamepad /
# remote keys, and the search box has a real text cursor: Left / Right / Home / End / Ctrl+arrows / Del (poster
# edition: Down goes to the results, a click in the box puts the cursor there).
# Poster edition: the next row peeks in under the last full row, and the genre / year / rating / type filters now look
# up every title they need instead of only the ones you had scrolled past.
#
# When the card counts down. A chapter-skip script such as op-ed-pv-skip.lua jumps over the ED / credits / preview
# chapters (straight to the next file when they are the last ones), so the card can never appear during them.
#   credits = the card appears when the ED / credits chapters start; at 0 the rest is skipped
#   before  = the countdown runs in the last seconds BEFORE those chapters and ends where they begin
#   auto    = before when a chapter-skip script is loaded, else credits
next_episode_timing=auto
