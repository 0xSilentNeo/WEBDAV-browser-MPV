# webdav-browser.conf  (script v10.6; the poster options only apply to webdav-browser-posters.lua)
# Location: <mpv config>/script-opts/webdav-browser.conf   (Windows: %APPDATA%\mpv\script-opts\)
# The file is re-read live while the browser is open, so most changes apply without restarting mpv.
# Comments go on their own line. Booleans: yes/no (true/false also work).
#
# CREDENTIALS ARE NOT INCLUDED IN THIS FILE. Add your own two lines (no spaces around the value):
#   user=YOUR_REAL_DEBRID_USERNAME
#   pass=YOUR_WEBDAV_PASSWORD

url=https://dav.real-debrid.com
user=USER
pass=PASS

start_path=/torrents
# name | recent
default_sort=recent
font_size=28

# ===================== playback =====================
autoplay_next=yes
# let mpv prepare the next queued file while the current one plays
prefetch=yes
# close the browser automatically once a file starts playing
auto_close_on_play=yes
# how a file is retried when it fails to open
max_retries=2
retry_delay=1.5

# ===================== network =====================
curl_path=curl
request_timeout=15
# listings older than this are shown instantly, then refreshed quietly (seconds)
cache_ttl=600
# send credentials only for files on your server
scoped_auth=yes

# ===================== library search ('f') =====================
index_enabled=yes
index_auto_update=yes
index_refresh_hours=24
index_delay_secs=0.6

# ===================== interface =====================
# "S01E03" + [4K] [HDR] [DV] [ATMOS] chips; set to no to see raw names (EXPERIMENTAL)
experimental_clean_titles=yes
clean_titles_chips=yes
clean_titles_tooltip=yes
double_click_ms=400
scroll_lines=3
resume_notice=yes
start_over_key=b
continue_row=yes
# auto | lite | full | off
background_blur_mode=auto
# press 'd' in the browser to toggle at any time
debug_overlay=no

# ===================== New in 10.1 =====================
# how credentials reach curl: auto (Windows = command line, others = stdin) | arg | stdin
curl_auth_mode=auto

# ===================== New in 10.2 =====================
# visited = search only the folders you open | full = also crawl the whole library in the background
index_mode=visited
# buffering (RAM). Whichever limit is reached first stops buffering.
# seconds of video to buffer ahead (was 60)
demuxer_readahead_secs=300
# forward buffer in MiB, 1024 = 1 GiB of RAM (was 300)
demuxer_max_bytes_mb=1024
# backward buffer in MiB, used when seeking back (was 50)
demuxer_max_back_bytes_mb=256
# queue + prefetch the next episode at this percent of the current one (was 70)
prefetch_threshold_pct=75
# ...or earlier, as soon as the current file is completely buffered
prefetch_on_buffered=yes

# ===================== New in 10.3 =====================
# right edge of file rows: "Watched" / "20% - 40:00 left" (no = only the small tick after the name)
show_status_text=yes
watched_label=Watched
# keep mpv open when a file fails to load, instead of quitting
stay_open=yes
# let ffmpeg reconnect dropped HTTP streams
http_reconnect=yes

# ===================== New in 10.4 =====================
# DOWNLOAD-WHILE-PLAYING fallback. When streaming a file fails (for example Real-Debrid answering
# HTTP 503 to mpv's range requests), the file is downloaded with curl and played while it downloads.
# You can also start it yourself with the P key on a highlighted file.
fallback_download=yes
# start the fallback after this many failed stream attempts (1 = immediately)
fallback_after_failures=1
# start playing once this many MB are downloaded
fallback_start_mb=200
# folder for the partial download; empty = <temp folder>/webdav-browser-cache
fallback_dir=
# how long playback waits for the download to catch up before giving up (seconds)
fallback_stall_secs=45
# keep the downloaded file afterwards (no = delete it)
fallback_keep=no
# leftover files older than this are removed at startup (hours)
fallback_cleanup_hours=24

# ===================== New in 10.5 =====================
# left-panel folder names: "Title  S01  GROUP  [4K] [HDR]" instead of the full release name
# (the release group, e.g. Framestore / VARYG, is kept; the full name shows in the tooltip)
clean_folder_titles=yes

# ===================== New in 10.6 =====================
# Key(s) that open/close the browser. Needs an mpv restart. Names like ctrl+p, ctrl+shift+p, alt+b, F2.
# Several keys on one script: separate with spaces, e.g.  open_key=ctrl+w alt+w
# webdav-browser.lua (plain) uses open_key; webdav-browser-posters.lua uses open_key_posters.
# You can keep BOTH scripts installed with different keys: opening one closes the other, and they share
# watch history. Keep the two keys different.
open_key=ctrl+w
open_key_posters=ctrl+p

# ===================== Poster edition (webdav-browser-posters.lua only) =====================
# EXPERIMENTAL. Shows the TMDB poster of the open folder in a column on the right.
# Run ONLY ONE of webdav-browser.lua / webdav-browser-posters.lua at a time (both use Ctrl+W and the same data file).
# The original webdav-browser.lua ignores these lines (mpv may log "unknown option" - harmless).
experimental_posters=yes
# free key from themoviedb.org > Settings > API: the 32-character API key, or the long read-access token (starts with eyJ)
tmdb_key=
# width of the poster column as a percent of the window (the file list gets narrower; window must be 900px+ wide)
poster_column_pct=17
# auto | powershell | ffmpeg | magick   (auto = PowerShell on Windows, ffmpeg elsewhere)
poster_converter=auto
# empty = <mpv config>/script-opts/webdav_posters
poster_cache_dir=

# ===================== New in 10.7 (webdav-browser-posters.lua only) =====================
# Netflix-style home screen: rows of poster cards with the clean title underneath
# (Continue Watching, Recently Added, All Titles). Enter opens a title or resumes a Continue Watching card.
# Keys on the home screen: arrows/hjkl move, Enter open/play, O open folder, F search, V classic list view, Esc close.
# Inside a title, Esc goes back to the home screen, V jumps to it.
# no = open straight into the classic list view
home_view=yes
# poster card width as a percent of the window height (bigger number = bigger posters, fewer per row)
home_card_pct=19
# how many titles the "Recently Added" row holds
home_recent_count=20

# ===================== New in 10.8 (webdav-browser-posters.lua only) =====================
# Enter on a title opens a title page: poster, description and one still image per episode (from TMDB), grouped by season.
# Keys there: Enter play, A queue, M watched/unwatched, S sort, V classic list, T look the artwork up again, Esc back.
# yes = all seasons of a show become ONE card on the home screen (the title page lists every season)
merge_seasons=yes
# yes = playing a file also queues the files after it (a real mpv playlist; works across seasons on the title page)
queue_folder=yes
# never queue more than this many files at once
queue_max=200
# home screen / title page: press twice to delete the poster, still and listing cache (watch history is never touched)
cache_clear_key=ctrl+x
