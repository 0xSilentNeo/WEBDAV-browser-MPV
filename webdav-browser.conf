# webdav-browser.conf - settings for webdav-browser.lua (list, Ctrl+W) and webdav-browser-posters.lua (posters, Ctrl+P)
# Location: <mpv config>/script-opts/webdav-browser.conf   (Windows: %APPDATA%\mpv\script-opts\)
# Lines marked (posters) only apply to webdav-browser-posters.lua; the list edition ignores them.
# The file is re-read while the browser is open, so most changes apply at once (keys: the poster edition at once,
# the list edition after an mpv restart).
# One setting per line, no spaces around "=", comments on their own line. yes/no (or true/false) for on/off.
#
# CREDENTIALS ARE NOT INCLUDED IN THIS FILE. Fill in your own (no spaces around the value).

# ===================== connection =====================

# Your WebDAV server. Real-Debrid: https://dav.real-debrid.com
url=https://dav.real-debrid.com

# WebDAV login (Real-Debrid: your username and your WebDAV password)
user=YOUR_REAL_DEBRID_USERNAME
pass=YOUR_WEBDAV_PASSWORD

# The folder the browser opens on
start_path=/torrents

# Send the login only with requests to your own server (yes), never with other links mpv opens
scoped_auth=yes

# How the login reaches curl. Since 26.8 it goes in a small file next to the data file (webdav_browser_curl.cfg),
# so it never shows in mpv's log; this is only used when that file can't be written:
# auto (Windows = command line, others = stdin) | arg | stdin
curl_auth_mode=auto

# curl program (built into Windows 10+; a full path works too)
curl_path=curl

# Seconds before a request counts as failed
request_timeout=15

# Folder listings older than this (seconds) are still shown at once and refreshed quietly in the background
cache_ttl=600

# ===================== services (posters) =====================

# (posters) Free TMDB key (themoviedb.org > Settings > API): the 32-character API key, or the long read-access token (eyJ...)
tmdb_key=

# (posters) OPTIONAL Real-Debrid API token (real-debrid.com/apitoken). Needed for the add screen (N); also lets the
# missing-episode cards say WHY a file is missing ("File unavailable", "Torrent dead"...). Only ever sent to Real-Debrid.
rd_api_token=

# (posters) Stremio add-on manifest URLs for the add screen (AIOStreams, Comet, Torrentio...), separated by spaces.
# They usually contain your Real-Debrid key: treat them like a password.
addon_urls=

# (posters) AIOStreams only: the password of your AIOStreams configuration (not your Real-Debrid key). With it the add
# screen uses AIOStreams' search API: real folder and file names, both sizes, cached state, group and languages.
aiostreams_password=

# (posters) Romaji anime folder names ("Vanitas no Carte") are looked up on AniList (no key needed) and mapped to the
# exact TMDB show, season and episode with the anime-lists id map (downloaded once, ~6 MB, refreshed weekly)
anime_lookup=yes

# (posters) Pin a folder to a TMDB title when the lookup keeps picking the wrong one. Entries separated by ";":
#   <words from the folder name>=tv:<TMDB id>  or  =movie:<TMDB id>   (optional :<season> = the folder holds that season)
# The id is the number in the TMDB address (themoviedb.org/tv/65930 -> tv:65930). Example:
#   poster_overrides=boku no hero=tv:65930; sennen kessen=tv:30984:17
# Afterwards press T on the title to look it up again.
poster_overrides=

# ===================== library =====================
# Initial sort: name | recent (S toggles it in the browser)
default_sort=recent
# "Show S01E03" plus quality chips (4K, HDR, DV, Atmos, Remux) instead of the raw release names
clean_titles=yes
clean_titles_chips=yes
# Hovering a row shows its full release name
clean_titles_tooltip=yes
# Left-panel folder names cleaned the same way ("Title  S01  GROUP  [4K] [HDR]"); the full name is in the tooltip
clean_folder_titles=yes
# "Continue Watching" at the top of the list / home screen
continue_row=yes
# Right edge of file rows: "Watched" / "20%  40:00 left" (no = only a small tick after the name)
show_status_text=yes
watched_label=Watched
# (posters) All seasons of a show become one card on the home screen; the title page lists every season
merge_seasons=yes
# (posters) Folders matched to the same TMDB title also become one card (e.g. "Bleach USBD", "Bleach - Box 01",
# "[WF] BLEACH Sennen Kessen-hen" -> one "Bleach" card with Season 1 ... 17). Unmatched folders stay separate.
merge_by_tmdb=no
# (posters) Title page: a greyed card for each episode WebDAV does not list (a gap in the numbering)
show_missing_episodes=yes

# ===================== library search =====================
# Search by file name (F) through an index of your library
index_enabled=yes
# Keep the index up to date by itself
index_auto_update=yes
# Rebuild the index after this many hours
index_refresh_hours=24
# visited = only the folders you open | full = also crawl the whole library in the background
index_mode=visited
# Pause between crawl requests in seconds (gentle on the server)
index_delay_secs=0.6

# ===================== playback =====================
# Play the next episode when one ends
autoplay_next=yes
# Playing a file also queues the files after it (a real mpv playlist, across seasons on the title page)
queue_folder=yes
# Never queue more than this many files at once
queue_max=200
# Let mpv open the next queued file while the current one plays
prefetch=yes
# Queue and open the next episode at this percent of the current one...
prefetch_threshold_pct=75
# ...or as soon as the current file is completely buffered
prefetch_on_buffered=yes
# Close the browser once a file starts playing
auto_close_on_play=yes
# Retries when a file fails to open, and the wait between them (seconds)
max_retries=2
retry_delay=1.5
# Keep mpv open when a file fails, instead of quitting
stay_open=yes
# Let ffmpeg reconnect a dropped stream
http_reconnect=yes
# Buffer: seconds of video read ahead, and the RAM it may use (MiB ahead / behind). The first limit reached wins.
demuxer_readahead_secs=840
demuxer_max_bytes_mb=2048
demuxer_max_back_bytes_mb=1024
# "Resumed at 12:34" when a file continues where you left it; the key starts it over during that note
resume_notice=yes
start_over_key=b
# The audio and subtitle language are remembered per show (choose once, every episode starts that way)
remember_tracks=yes

# ===================== download-while-playing =====================
# When streaming fails (e.g. Real-Debrid answering HTTP 503 to mpv's seeks), the file is downloaded with curl and
# played while it downloads. P on a highlighted file starts this yourself.
fallback_download=yes
# Start it after this many failed stream attempts (1 = at once)
fallback_after_failures=1
# Start playing once this many MB are on disk
fallback_start_mb=200
# Folder for the download; empty = <temp folder>/webdav-browser-cache
fallback_dir=
# Give up when the download has not caught up after this many seconds
fallback_stall_secs=45
# Keep the file afterwards (no = delete it)
fallback_keep=no
# Leftover files older than this (hours) are removed at startup
fallback_cleanup_hours=24

# ===================== next episode / now playing / startup note =====================
# "Up next" card at the ending (or the last seconds): the next episode's still, name and a countdown ring.
# At 0 the next episode starts; Enter plays it now, Esc keeps watching.
next_episode_card=yes
next_episode_secs=6
# When it counts down: credits = when the ending / credits chapters start | before = in the last seconds BEFORE them
# (for chapter-skip scripts like op-ed-pv-skip, which jump over them) | auto = before when such a script is loaded
next_episode_timing=auto
# A small card for a few seconds when a file starts from the browser or the add screen, and how long it stays
now_playing_card=yes
now_playing_secs=4
# A short note when mpv starts ("WEBDAV LIBRARY · Ready · Press Ctrl+P to browse"); one note when both editions are loaded
startup_toast=yes
# Where each sits: top-left, top, top-right, bottom-left, bottom, bottom-right, center
next_card_position=bottom-right
now_playing_position=top-left
startup_toast_position=top-right
# Blur the video behind the cards (needs vo=gpu-next in mpv.conf; otherwise they are tinted)
glass_blur=yes

# ===================== look =====================
# Text size of the list edition (pixels)
font_size=28
# Blur the video behind the browser: auto | lite | full | off
background_blur_mode=auto
# Double-click speed (ms) and rows moved per mouse-wheel notch
double_click_ms=400
scroll_lines=3
# Debug overlay (D in the browser toggles it)
debug_overlay=no

# ===================== poster screens (posters) =====================
# Open on the poster home screen (Continue Watching, All Titles); no = open the classic list view
home_view=yes
# Size of every poster screen: 1.0 = sized to the window (4K gets the same layout as 1080p, just sharper),
# 1.2 = 20% bigger, 0.85 = smaller
ui_scale=0.9
# Poster width on the home screen, in percent of the window height (bigger = fewer, larger posters)
home_card_pct=16
# Sizes in steps of the window height: resizing reflows the grid instead of converting the pictures again
ui_size_steps=yes
# Continue Watching shows the episode's still (16:9) instead of the show's poster
continue_landscape=yes
# Rounded corners on pictures (pixels at 1080p; 0 = square) and a soft shadow under each card
card_radius=6
card_shadows=yes
# The selected card grows by this factor (1 = off)
selected_grow=1.06
# Gliding selection outline, fade-ins and shimmering placeholders (off while a video plays)
animations=yes
# Frames per second for both: 0 = your display's refresh rate, at most 90
animation_fps=0
# EXPERIMENTAL title page: a large TMDB backdrop beside the text, faded into the background (needs ffmpeg or PowerShell)
experimental_backdrop=yes
# Classic list view: the open folder's poster in a column on the right, its width in percent of the window
poster_column=yes
poster_column_pct=17

# ===================== artwork (posters) =====================
# Converter for the pictures: auto (ffmpeg when installed - much faster - else PowerShell on Windows) | ffmpeg |
# powershell | magick
poster_converter=auto
# Cache folder for pictures and TMDB data; empty = <mpv config>/script-opts/webdav_posters
poster_cache_dir=
# Prepare the artwork this many rows ahead while nothing else loads
idle_prefetch_rows=3
# Then prepare the artwork of the whole library once, in the background (about 0.9 MB per poster on a 4K window).
# Downloaded pictures are kept for good: a different size or window reuses them instead of downloading again.
precache_artwork=yes
# Press twice: delete the picture, TMDB and listing cache (watch history is never touched). The list edition clears its
# folder-listing cache with it.
cache_clear_key=ctrl+x

# ===================== add from add-ons (posters) =====================
# N opens it: search a film or series and choose a release from your add-ons; tick the files, they are added to
# Real-Debrid and play from the one you pick. Tab switches to Nyaa.si (plain torrents, not cache-checked).
add_key=n
# Nyaa site or mirror, and category: 0_0 all, 1_0 anime, 1_2 anime English, 1_3 anime other, 1_4 anime raw, 4_0 live action
nyaa_url=https://nyaa.si
nyaa_category=1_0
# Home page row "Popular on ...": your country (2 letters) and the services as name=TMDB provider id(s)
addon_region=US
addon_providers=Netflix=8; Prime Video=9|119; HBO Max=1899|384; Apple TV+=350; Crunchyroll=283

# ===================== torrent streaming (posters) =====================
# Real-Debrid refuses many WEB-DL / WEBRip releases ("infringing file"). Those can stream as a torrent with rqbit
# (github.com/ikatson/rqbit): it downloads in order and mpv plays while it downloads. Windows: put rqbit.exe next to
# mpv.exe (or write its full path here) and allow it in the firewall. Empty = off.
torrent_client=rqbit
# rqbit's local port (an rqbit already running there is used as it is)
torrent_port=3030
# Extra rqbit options, e.g. a speed limit in bytes per second: --ratelimit-download 20000000
torrent_client_args=
# MB of the file downloaded before playback starts (a progress bar shows it)
torrent_start_mb=200
# auto = refused releases and Real-Debrid links that won't play stream as a torrent straight away; manual = press T
torrent_fallback=auto
# Trackers added to magnet links (Nyaa releases bring their own)
torrent_trackers=udp://tracker.opentrackr.org:1337/announce udp://open.stealth.si:80/announce udp://tracker.torrent.eu.org:451/announce udp://exodus.desync.com:6969/announce udp://open.demonii.com:1337/announce http://nyaa.tracker.wf:7777/announce

# ===================== keys =====================
# Open / close the browser (needs an mpv restart). Several keys: separate with spaces. Keep the two different.
open_key=ctrl+w
open_key_posters=ctrl+p
# (posters) Gamepad / TV remote: auto = bigger focus ring and a button legend once a pad or remote key is used;
# yes = always; no = off. The key that opens the poster browser from a pad:
couch_mode=auto
couch_open_keys=GAMEPAD_BACK
# (posters) Setup check: tests every service and folder and says what to change. Works anywhere, also during playback.
# If input.conf uses this key already:  F1 script-binding webdav_browser_posters/webdav-doctor
key_doctor=F1
#
# Keys inside the browser: one action per line, its keys separated by spaces (mpv names: UP, ENTER, BS, ESC, PGUP,
# ctrl+d, MBTN_BACK...); empty = no key. They only exist while the browser is open, and then win over input.conf.
key_up=UP KP_UP KP8 k
key_down=DOWN KP_DOWN KP2 j
key_left=LEFT KP_LEFT KP4 h
key_right=RIGHT KP_RIGHT KP6 l
key_page_up=PGUP
key_page_down=PGDWN
key_first=HOME
key_last=END
key_open=ENTER KP_ENTER KP5
key_back=BS MBTN_BACK
key_close=ESC
# Right mouse button = back
right_click_back=no
key_search=f
# List edition: search the open folder only; poster edition: a second search key
key_search_folder=/
key_sort=s
key_queue=a
key_watched=m
key_refresh=r
key_refresh_all=R
# (posters) look the artwork up again, write a diagnostics report, switch between posters and the list view
key_refetch_art=t
key_report=ctrl+d
key_switch_view=v o
key_debug=d
# List edition: switch panel, hide watched files, download-while-playing
key_switch_panel=TAB
key_hide_watched=H
key_play_download=p

# ===================== New in 24 =====================
# Card sizes of their own, in percent of the window height (bigger = fewer, larger cards):
# Continue Watching stills
landscape_card_pct=23
# Title-page episode / file stills
episode_card_pct=24
# (posters) Opening a title: its poster grows out of the card into place; Play: the screen fades to black with
# "Starting ..." until the video is up (needs mpv 0.38+)
transitions=yes
# (posters) ffmpeg program for the artwork (a full path works too, e.g. C:\ffmpeg\bin\ffmpeg.exe)
ffmpeg_path=ffmpeg
# Font for all browser text
font_name=Segoe UI
# Accent colour (RRGGBB): titles, selection, progress (empty = the theme's own, see "New in 26")
color_accent=
# How much the video behind the browser is dimmed (0-100)
dim_background_pct=46
# Most entries in Continue Watching
continue_max_items=30
# Start with watched files hidden (H toggles it)
hide_watched_default=no
# A file counts as watched past this percent (or in its last seconds)
watched_threshold_pct=95
# Only resume past this position (seconds)
resume_min_secs=15

# ===================== New in 25 =====================
# (posters) Height of the top bar (1 = the old, taller bar; 0.3 - 1.4, its text shrinks with it)
top_bar_scale=0.4
# (posters) EXPERIMENTAL: top and bottom bars as thin floating glass pills. Top: Home, the breadcrumbs (each clickable),
# the status pill (click it for the setup check; when offline it retries) and close. Bottom: the keys and the cache.
# Also on the add screen (N), whose title details float in a card above the keys. no = the classic bars
experimental_glass_bars=yes

# ===================== New in 26 =====================
# ---- Theme ----
# The browser's palette: classic (Sakura Night: plum, pink accent) | graphite (cool slate, ice blue) |
# netflix (near-black, red) | rose (muted rose on warm dark) | ios (true black, system blue)
theme=ios
# Any colour below (RRGGBB) overrides that one colour of the theme; empty = the theme's
# page background / top + bottom bars / panels / unfocused panels
color_bg_dim=
color_bg_header=
color_bg_panel=
color_bg_panel_dim=
# text: main / secondary / dim
color_text_primary=
color_text_muted=
color_text_dim=
# states: done + online / in progress + warnings / errors
color_good=
color_warn=
color_bad=
# the rating star, progress-bar tracks
color_star=
color_track=
# (list) folder / video / audio / other file names, cached folders, unfocused panel border, the gradient border
color_folder=
color_video=
color_audio=
color_file=
color_cached_folder=
color_border_unfocus=
color_border_grad_top=
color_border_grad_mid=
color_border_grad_bottom=
# The glass toasts and cards (Ready, Up next, Now playing, the download cards) have a palette of their own:
# classic | graphite | netflix | rose | ios
toast_theme=classic
# toast colours (RRGGBB): glass tint, hairline edge, text, countdown ring, accent, the dots (done / warning / error)
toast_color_fill=
toast_color_edge=
toast_color_text=
toast_color_ring=
toast_color_accent=
toast_color_good=
toast_color_warn=
toast_color_bad=

# ---- Motion ----
# (posters) zoom = opening a title: the poster flies in, the backdrop settles, the lines and rows of cards follow;
# Back flies the poster home into its card. fade = only the poster flight and the fade (v25). Needs transitions=yes
transition_style=zoom
# The status dot breathes, and the download / torrent cards' bars glow and sweep while they wait (no = all still)
pulse=yes

# ---- Cards ----
# (posters) dim = the other cards darken around the selected one (mpv 0.38+) | ring = only the outline
focus_style=dim
# (posters) How dark the other cards get with focus_style=dim (0-90)
dim_others_pct=40
# (posters) Space between cards, % of a card's width
card_gap_pct=9
# (posters) yes = the cards of a row spread over the whole width (wider gaps instead of space on the right)
card_spread=yes
# (posters) Season posters of a long show, % of the window height (0 = the same as home_card_pct)
season_card_pct=0

# ---- Title page ----
# (posters) The poster beside the text (no = text, buttons and backdrop only, like Netflix)
hero_poster=yes
# (posters) The band's height, % of its normal size (80 - 130; the poster follows it)
hero_poster_pct=100
# (posters) The whole synopsis (also the "More" at its end)
key_more=i
# (posters) The Download button opens a small card with every file of the title (tick the ones you want), where they go
# and the live progress; Enter starts and closes it. Files go to this folder (empty = Downloads\webdav-browser in your user folder), one folder per
# title; a file already there is skipped, a half-finished one is continued.
download_dir=

# ---- Download cards ----
# Where the download-while-playing / Real-Debrid / torrent card sits: top-left, top, top-right, center, bottom-left,
# bottom, bottom-right
download_card_position=center

# ---- Library search ----
# (posters) Also find titles by their cast / by TMDB keywords ("time travel"). Original and other titles and the
# film series are always searched. Fetched once per title, in the background.
search_cast=yes
search_keywords=yes

# ===================== New in 26.1 =====================
# (posters) The accent outline around the selected card as well (no = the Netflix look: the card grows and the others
# dim; the outline is always there with focus_style=ring, on mpv older than 0.38 and in couch mode)
focus_ring=no
# (posters) The title and rating line under the cards (library and add-on rows), % of the normal text size
card_label_pct=60
# (posters) The rows glide when the page scrolls, like a website (no = they jump a row at a time)
smooth_scroll=yes
# Hide the player's controller (osc / ModernZ) while the browser is open over a video, so its seekbar and
# thumbnails can't show through; when the browser closes it gets this visibility back: auto | always
hide_osc=yes
osc_visibility=auto

# ===================== New in 26.2 =====================
# (posters) Add screen: when your add-ons (AIOStreams) find fewer than nyaa_fallback_below releases for a title, offer
# Nyaa.si: ask = a "Search Nyaa.si" button under the list (Tab presses it) | auto = anime goes to Nyaa.si by itself,
# the rest still asks | no = never
nyaa_fallback=ask
nyaa_fallback_below=5
# (posters) The download card from any page (Shift+D); the ↓ Downloads pill next to the cache pill does the same
key_downloads=D

# ===================== New in 26.3 =====================
# (posters) Add screen title page: the "Search Nyaa.si" button on anime titles only | always (Tab searches Nyaa.si on any title)
nyaa_button=anime
# (posters) Tracked shows: "+ Track" on title pages (library and add screen) and the Tracked pill on the top bar
# (its flyout lists them with the next episode / release date; key_tracked opens it). Checked ~25 s after mpv
# starts and then every track_check_hours hours while it runs; what is new is said in one toast when nothing plays.
track_shows=yes
track_check_hours=3
# the bell of a newly tracked title (change it per title with the bell in the flyout):
# all = every new episode | season = new seasons only | off
track_bell=all
key_tracked=u

# ===================== New in 26.4 =====================
# (posters) A file you downloaded (download_dir) plays from your computer instead of streaming; its episode card says
# "⤓ on your PC". no = always stream
play_local_first=yes
# (posters) A small "Skip intro · S" note while a named OP / intro chapter plays (not when a chapter-skip script like
# op-ed-pv-skip is loaded - it skips by itself). The next-episode card also takes S: skip the credits
skip_intro_card=yes
# (posters) The search's filter chips (TV, Movies, Unwatched, ★ 8+, the library's genres and decades) on the home
# page too: they filter All Titles and are remembered
home_filter_chips=yes
# (posters) The Tracked flyout: list | calendar (the week on top, the titles grouped by day; the ▦ / ☰ pill switches too)
track_view=list
# (posters) News of a new episode also says whether your add-ons already have a cached release of it
track_cached_check=yes
#
# ---- EXPERIMENTAL visuals (new in 26.4; off by default, on here so you can see them) ----
# The paused video stays visible behind the browser, dimmed and blurred (the blur needs vo=gpu-next), and how much
experimental_video_glass=yes
experimental_video_glass_pct=72
# (hero wash, title logo, new badges, hover lift, exit animation and empty states are no longer experimental:
# see "New in 26.6" - their old experimental_* names are still read)
#
# ================================================================
# New in 26.5
# ================================================================
# One click opens a title or plays an episode / file (both editions; the add screen's cards and search results too).
# no = the old way: one click selects, a double-click opens. Release and file lists keep select-then-Enter either way
single_click_open=yes
# (posters) The Tracked pill's bell rings now and then (a little rock and a soft halo) while a tracked show has news
# you have not looked at. no = only the red dot
track_bell_anim=yes
#
# ================================================================
# New in 26.6
# ================================================================
# No longer experimental (on by default; the old experimental_* names still work):
# (posters) A soft glow in the poster's colour behind the title page's text, and its strength (4-40)
hero_wash=yes
hero_wash_pct=14
# (posters) TMDB's logo of the show / film instead of the title text on the title page (when TMDB has one)
title_logo=yes
# (posters) NEW on episodes that aired this week; "S02E07 · tomorrow 9:30 pm" on the cards of tracked shows
new_badges=yes
# (posters) With the mouse, the card under the pointer grows (and only that one; off the posters, none). The keys
# and a gamepad show the selection as before - the first key press after the mouse takes over from that card
hover_lift=yes
# (posters) The download popover, the queue window and the Tracked flyout fade out instead of vanishing
exit_anim=yes
# (posters) A drawn illustration on empty pages (an empty library or search, the queue, Tracked)
empty_states=yes
#
# (posters) Air times in your own time zone: when an episode airs (TVmaze, no key needed; anime: AniList), shown on
# the Tracked flyout, the title pages and the cards ("Tue 20 Oct  9:30 pm  ·  in 3 days")
track_air_times=yes
# (posters) After an episode airs, your add-ons are asked every track_poll_mins minutes (for up to a day) until a
# cached release is up - then a toast and a sound say it can be streamed. Without add-ons: at its air time
track_watch_release=yes
track_poll_mins=15
# (posters) The sound with that news: yes (Windows' notification sound) | no | the path of your own .wav file.
# It plays even while a video plays (the toast shows then too)
track_sound=yes
# (posters) Times as 20:30 instead of 8:30 pm
clock_24h=no
#
# ---- EXPERIMENTAL (off by default; on here so you can try it) ----
# (posters) The mouse does everything: the key hints in the bottom bar are buttons (a click presses that key),
# a card under the pointer gets round buttons (play, queue, watched, download / find more) and a right-click opens a
# menu for the title under the pointer (right_click_back still goes back anywhere else)
experimental_mouse_ui=yes
#
# ================================================================
# New in 26.7
# ================================================================
# (posters) While the rows glide, the posters show as their soft blurred stand-ins (cheap to move, so the glide stays
# smooth on a 4K screen); the sharp posters land the moment it stops. no = sharp all the way (heavier)
scroll_blur=yes
# (posters) With the mouse: rest the pointer this long (seconds) on a card of the cut-off bottom row and the page moves
# up one row to show it. Moving on before then does nothing; after one move the pointer has to leave that row before it
# can happen again. 0 = never (the default since 26.10 - the wheel and the keys scroll). Try 1.2 if you want it back
bottom_reveal_secs=0
# (posters, with experimental_mouse_ui) The round play / queue / watched / download buttons on the card under the
# pointer. They come after a short rest on the card and leave with the pointer. no = never
hover_buttons=yes
# Messages while a video plays ("Resumed at 12:34  ·  B start over", "Retrying…", "Couldn't play…") as glass pills
# like the other toasts. The resume notice sits beside the Now playing card. no = mpv's plain text
playback_toasts=yes
#
# ================================================================
# New in 26.9
# ================================================================
# (posters) Clean the artwork cache: episode stills, season posters and backdrops older than this many days are
# deleted (they are downloaded again when you open that title). Posters and logos are always kept. Checked at most
# once a day, a few files at a time. 0 = keep everything (as before)
cache_max_age_days=0
#
# ================================================================
# New in 26.10
# ================================================================
# ---- EXPERIMENTAL motion (each one off by default; on here so you can try it) ----
# They need animations=yes and, like the other animations, never run over a playing video (the Now playing card is
# the exception: it belongs to playback). Set any of them to no to turn it off.
# (posters) Pushing past the last card of a row (Continue Watching, the add screen's rows) or past the end of the page
# - with the keys or the wheel - gives a short springy bounce, so you can tell there is nothing more
experimental_rubberband=yes
# (posters) Continue Watching and the title page's episode stills: the picture of the card under the pointer floats
# a few pixels against it (mpv 0.38+)
experimental_parallax=yes
# The text cursor blinks (solid while you type) and each letter you type fades in - the library search, the add
# screen's search and filter, and the list edition's search
experimental_caret=yes
# Closing the browser (Esc on the home page, the close button, the open key): the page fades into the video while the
# posters shrink away, in about a quarter of a second (posters: mpv 0.38+). The list edition fades out. Esc, a click
# or the open key end it at once
experimental_exit_to_video=yes
# (posters) Title page: the Play button tilts towards the pointer, in 3D
experimental_play_tilt=yes
# (posters) Home: the search pill rests as just its magnifier and opens on hover, F or a click
experimental_search_collapse=yes
# (posters) Searching the library: the results follow every key you type (at most every 60 ms), instead of waiting
# until you stop typing
experimental_live_search=yes
# (posters) The filter chips pop in one after another when they open
experimental_chip_stagger=yes
# (posters) A decoding effect - scrambled letters settling left to right: the title page's name (when it has no logo),
# the status pill (Online / Offline), the notices in the top row and Tracked news
experimental_decode=yes
#
# ================================================================
# New in 26.11
# ================================================================
# ---- EXPERIMENTAL (off by default; on here so you can try it) ----
# (posters) Rows that scroll sideways (Continue Watching, the add screen's rows, "More like this") glide when they move
# - the arrows, the keys, a touchpad's sideways swipe - and can be dragged with the mouse: grab a row, let go and it
# settles on a card; a quick flick carries on a little; pulled past either end it stretches and springs back
experimental_row_drag=yes
